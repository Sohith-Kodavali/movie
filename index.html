<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Movie night</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <!--
      The href below is the link used when Firestore has nothing saved yet.
      Once the admin panel has saved a link, js/watch.js replaces it.
      Admin: admin.html
      Firebase keys: js/firebase-config.js
    -->
    <a class="watch" href="https://example.com" data-watch autofocus>Watch movie</a>
  </main>

  <script>
    (function () {
      var watch = document.querySelector('[data-watch]');

      function focusWatch() {
        try { watch.focus({ preventScroll: true }); } catch (err) { watch.focus(); }
      }

      focusWatch();

      watch.addEventListener('click', function () {
        watch.textContent = 'Opening\u2026';
        watch.setAttribute('aria-busy', 'true');
      });

      window.addEventListener('pageshow', function () {
        watch.textContent = 'Watch movie';
        watch.removeAttribute('aria-busy');
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ' || event.key === 'Select') {
          if (document.activeElement !== watch) {
            event.preventDefault();
            watch.click();
          }
        }
      });
    })();
  </script>
  <script type="module" src="js/watch.js"></script>
</body>
</html>
